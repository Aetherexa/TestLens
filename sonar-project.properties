# Project identity is injected from repository variables; never commit tokens.
sonar.sources=packages/core/src,packages/vscode/src
sonar.tests=packages/core/src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,**/dist/**,**/coverage/**,**/node_modules/**
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info
sonar.sourceEncoding=UTF-8
